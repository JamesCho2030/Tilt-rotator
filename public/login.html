<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JK INNOVATION 발주관리 시스템 - 로그인</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header">
        <h1>JK INNOVATION 발주관리 시스템</h1>
        <p>안전재고를 지키는 스마트 발주 플랫폼</p>
    </header>

    <main class="dashboard" style="max-width: 480px; margin: 2rem auto;">
        <section class="card">
            <h2>로그인</h2>
            <form id="login-form" class="form-grid">
                <label>이메일
                    <input type="email" name="email" required placeholder="admin@jkinnovation.com">
                </label>
                <label>비밀번호
                    <input type="password" name="password" required placeholder="비밀번호">
                </label>
                <button type="submit" class="button">로그인</button>
                <p class="message" style="margin-top:1rem;color:var(--mystic);"></p>
            </form>
        </section>
    </main>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
